name: Daily job monitor

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: Europe/Warsaw
    - cron: '0 7 * * *'
      timezone: Europe/Warsaw
    # Recovery check: already completed searches and digests are not repeated.
    - cron: '17 8 * * *'
      timezone: Europe/Warsaw
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: personal-job-monitor
  cancel-in-progress: false

jobs:
  check-due-work:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SCOUT_APP_URL: ${{ vars.SCOUT_APP_URL || 'https://scout-web-47vk.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Invoke due work with a short-lived GitHub identity
        run: python .github/scripts/trigger_due.py
