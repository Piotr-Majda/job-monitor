[project]
name = "qa-job-monitor"
version = "0.1.0"
description = "A personal, evidence-based QA opportunity inbox for Just Join IT"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.5",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.8",
  "psycopg[binary]==3.3.9",
  "jinja2==3.1.6",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "apscheduler==3.11.3",
  "playwright==1.65.1",
  "python-multipart==0.0.33",
  "itsdangerous==2.2.0",
  "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
