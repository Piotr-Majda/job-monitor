# Free hobby deployment: no Render database, worker, cron, or disk.
# Provide a free external PostgreSQL connection string through secret settings.
# GitHub Actions performs collection/email independently of the sleeping web app.
services:
  - type: web
    name: scout-web
    runtime: docker
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEPLOYMENT_MODE
        value: free
      - key: EMAIL_DELIVERY_EXTERNAL
        value: "false"
      - key: SCHEDULER_REPOSITORY
        value: Piotr-Majda/job-monitor
      - key: SCHEDULER_REPOSITORY_ID
        value: "1455285333"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SEARCH_TIME
        value: "06:00"
      - key: DIGEST_TIME
        value: "07:00"
